[package]
name = "trenino"
version = "0.9.3"
description = "trenino - Bridge hardware to Train Sim World"
authors = ["Alberto Restifo"]
license = "CC-BY-NC-4.0"
repository = "https://github.com/albertorestifo/trenino"
edition = "2021"

[lib]
name = "trenino_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
desktop-updater = ["dep:tauri-plugin-updater", "dep:tauri-plugin-dialog"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["webview-data-url"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tokio = { version = "1", features = ["time"] }
reqwest = { version = "0.13", features = ["blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
