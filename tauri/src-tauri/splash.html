    }
    .version {
      position: absolute;
      bottom: 1rem;
      font-size: 0.75rem;
      color: #B7C0C9;
      font-variant-numeric: tabular-nums;
    }
    @media (prefers-reduced-motion: reduce) {
      .spinner {
        animation: none;
      }
    }
