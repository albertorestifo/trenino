name: 'Install Linux desktop build dependencies'
description: >-
  System libraries required to build the Tauri desktop shell and UI tooling on
  Ubuntu runners (webkit, appindicator, patchelf, xdo for the keystroke sidecar).
runs:
  using: 'composite'
  steps:
    - name: Install Linux desktop build dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev \
          build-essential \
          libssl-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          patchelf \
          libxdo-dev \
          libclang-dev
