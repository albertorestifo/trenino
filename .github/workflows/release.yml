name: Release Desktop App

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 0.1.2) - must match version in source files'
        required: true
        type: string

permissions:
  contents: read

env:
  AVRDUDE_VERSION: '8.1'
  AVRDUDE_WINDOWS_X64_SHA256: e4d571d81fee3387d51bfdedd0b6565e4c201e974101cac2caec7adfd6201da3
  AVRDUDE_LINUX_X86_64_URL: https://github.com/avrdudes/avrdude/releases/download/v8.1/avrdude_v8.1_Linux_64bit.tar.gz
  AVRDUDE_LINUX_X86_64_SHA256: c751c88b1c0b886834d85cd4b19f100cc3415c896ab9f98cf7e2955edbcd678f
  VCREDIST_X64_URL: https://aka.ms/vs/17/release/vc_redist.x64.exe
  VCREDIST_X64_SHA256: cc0ff0eb1dc3f5188ae6300faef32bf5beeba4bdd6e8e445a9184072096b713b

jobs:
  # Verify version in source files matches the release tag
  verify-version:
    name: Verify Version
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Get and verify version
        id: get-version
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.release.tag_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          # Get expected version from tag or input
          if [ "$EVENT_NAME" = "release" ]; then
            EXPECTED="$TAG_NAME"
          else
            EXPECTED="$INPUT_VERSION"
          fi
          # Remove 'v' prefix if present
          EXPECTED="${EXPECTED#v}"

          echo "Expected version: $EXPECTED"

          # Extract versions from source files
          TAURI_VERSION=$(grep -E '"version": "[0-9]+\.[0-9]+\.[0-9]+"' tauri/src-tauri/tauri.conf.json | head -1 | sed 's/.*"version": "\([^"]*\)".*/\1/')
          CARGO_VERSION=$(grep -E '^version = "[0-9]+\.[0-9]+\.[0-9]+"' tauri/src-tauri/Cargo.toml | head -1 | sed 's/.*version = "\([^"]*\)".*/\1/')
          PACKAGE_VERSION=$(node -p "require('./tauri/package.json').version")

          echo "tauri.conf.json version: $TAURI_VERSION"
          echo "Cargo.toml version: $CARGO_VERSION"
          echo "tauri/package.json version: $PACKAGE_VERSION"

          # Verify all versions match
          FAILED=0
          if [ "$TAURI_VERSION" != "$EXPECTED" ]; then
            echo "::error::tauri.conf.json version ($TAURI_VERSION) does not match expected ($EXPECTED)"
            FAILED=1
          fi
          if [ "$CARGO_VERSION" != "$EXPECTED" ]; then
            echo "::error::Cargo.toml version ($CARGO_VERSION) does not match expected ($EXPECTED)"
            FAILED=1
          fi
          if [ "$PACKAGE_VERSION" != "$EXPECTED" ]; then
            echo "::error::tauri/package.json version ($PACKAGE_VERSION) does not match expected ($EXPECTED)"
            FAILED=1
          fi

          if [ "$FAILED" = "1" ]; then
            echo ""
            echo "::error::Version mismatch! Run './scripts/update-version.sh $EXPECTED' and commit before releasing."
            exit 1
          fi

          echo "All versions match: $EXPECTED"
          echo "version=$EXPECTED" >> $GITHUB_OUTPUT

  build-tauri:
    name: Build Tauri (${{ matrix.target }})
    needs: [verify-version]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows_x86_64
            tauri_target: x86_64-pc-windows-msvc
            rust_config: src-tauri/tauri.rust.windows.conf.json
            tauri_args: ""

          - os: ubuntu-22.04
            target: linux_x86_64
            tauri_target: x86_64-unknown-linux-gnu
            rust_config: src-tauri/tauri.rust.conf.json
            tauri_args: "--bundles appimage"

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Stage checksum-verified avrdude sidecar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force tauri/src-tauri/binaries | Out-Null
          & ./scripts/download-avrdude.ps1 -Version "$env:AVRDUDE_VERSION" -ExpectedSha256 "$env:AVRDUDE_WINDOWS_X64_SHA256" -DestinationDirectory "tauri/src-tauri/binaries" -TargetTriple "${{ matrix.tauri_target }}"

      - name: Stage checksum-verified avrdude sidecar (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fL -o avrdude.tar.gz "$AVRDUDE_LINUX_X86_64_URL"
          echo "$AVRDUDE_LINUX_X86_64_SHA256  avrdude.tar.gz" | sha256sum -c -
          tar -xzf avrdude.tar.gz
          mkdir -p tauri/src-tauri/binaries
          cp avrdude_Linux_64bit/bin/avrdude "tauri/src-tauri/binaries/avrdude-${{ matrix.tauri_target }}"
          chmod +x "tauri/src-tauri/binaries/avrdude-${{ matrix.tauri_target }}"
          cp avrdude_Linux_64bit/etc/avrdude.conf tauri/src-tauri/binaries/avrdude.conf

      - name: Stage checksum-verified VC++ Redistributable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force tauri/src-tauri/resources | Out-Null
          Invoke-WebRequest -UseBasicParsing -Uri "$env:VCREDIST_X64_URL" -OutFile vc_redist.x64.exe
          $hash = (Get-FileHash -Algorithm SHA256 vc_redist.x64.exe).Hash.ToLower()
          if ($hash -ne "$env:VCREDIST_X64_SHA256") { throw "vc_redist checksum mismatch: $hash" }
          Move-Item vc_redist.x64.exe tauri/src-tauri/resources/vc_redist.x64.exe

      - name: Install pinned vJoy extractor
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innoextract --version 1.9 -y --no-progress

      - name: Stage verified vJoy resources
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/stage-vjoy-resources.ps1

      - uses: ./.github/actions/setup-libclang
        if: runner.os == 'Windows'

      - uses: ./.github/actions/linux-desktop-deps
        if: runner.os == 'Linux'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.91.1
        with:
          targets: ${{ matrix.tauri_target }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            tauri/src-tauri -> target
            tauri/keystroke -> target

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            tauri/package-lock.json
            tauri/ui/package-lock.json

      - name: Install CLI and frontend dependencies, build the UI and keystroke sidecar
        shell: bash
        run: |
          npm --prefix tauri ci
          npm --prefix tauri/ui ci
          npm --prefix tauri/ui run build
          cargo build --release --manifest-path tauri/keystroke/Cargo.toml
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp tauri/keystroke/target/release/keystroke.exe "tauri/src-tauri/binaries/keystroke-${{ matrix.tauri_target }}.exe"
          else
            cp tauri/keystroke/target/release/keystroke "tauri/src-tauri/binaries/keystroke-${{ matrix.tauri_target }}"
          fi

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TRENINO_RUST_BUNDLE: 1
        with:
          projectPath: tauri
          tauriScript: npx tauri
          args: ${{ matrix.tauri_args }} --features rust-ui,desktop-updater --config ${{ matrix.rust_config }} --config src-tauri/tauri.updater.conf.json
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          tagName: v${{ needs.verify-version.outputs.version }}
          releaseName: "trenino v${{ needs.verify-version.outputs.version }}"
          releaseBody: "See the release notes for details."
          releaseDraft: false
          prerelease: false
