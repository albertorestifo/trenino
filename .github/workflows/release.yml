name: Release Desktop App

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 0.1.2) - must match version in source files'
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Verify version in source files matches the release tag
  verify-version:
    name: Verify Version
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Get and verify version
        id: get-version
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.release.tag_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          # Get expected version from tag or input
          if [ "$EVENT_NAME" = "release" ]; then
            EXPECTED="$TAG_NAME"
          else
            EXPECTED="$INPUT_VERSION"
          fi
          # Remove 'v' prefix if present
          EXPECTED="${EXPECTED#v}"

          echo "Expected version: $EXPECTED"

          # Extract versions from source files
          TAURI_VERSION=$(grep -E '"version": "[0-9]+\.[0-9]+\.[0-9]+"' tauri/src-tauri/tauri.conf.json | head -1 | sed 's/.*"version": "\([^"]*\)".*/\1/')
          CARGO_VERSION=$(grep -E '^version = "[0-9]+\.[0-9]+\.[0-9]+"' tauri/src-tauri/Cargo.toml | head -1 | sed 's/.*version = "\([^"]*\)".*/\1/')

          echo "tauri.conf.json version: $TAURI_VERSION"
          echo "Cargo.toml version: $CARGO_VERSION"

          # Verify all versions match
          FAILED=0
          if [ "$TAURI_VERSION" != "$EXPECTED" ]; then
            echo "::error::tauri.conf.json version ($TAURI_VERSION) does not match expected ($EXPECTED)"
            FAILED=1
          fi
          if [ "$CARGO_VERSION" != "$EXPECTED" ]; then
            echo "::error::Cargo.toml version ($CARGO_VERSION) does not match expected ($EXPECTED)"
            FAILED=1
          fi

          if [ "$FAILED" = "1" ]; then
            echo ""
            echo "::error::Version mismatch! Run './scripts/update-version.sh $EXPECTED' and commit before releasing."
            exit 1
          fi

          echo "All versions match: $EXPECTED"
          echo "version=$EXPECTED" >> $GITHUB_OUTPUT

  build-keystroke:
    name: Build Keystroke (${{ matrix.target }})
    needs: [verify-version]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows_x86_64
            tauri_target: x86_64-pc-windows-msvc
            binary_ext: ".exe"

          - os: ubuntu-22.04
            target: linux_x86_64
            tauri_target: x86_64-unknown-linux-gnu
            binary_ext: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxdo-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.tauri_target }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: tauri/keystroke -> target

      - name: Build keystroke utility
        working-directory: tauri/keystroke
        run: cargo build --release

      - name: Upload keystroke binary (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: keystroke-${{ matrix.target }}
          path: tauri/keystroke/target/release/keystroke.exe
          retention-days: 1

      - name: Upload keystroke binary (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: keystroke-${{ matrix.target }}
          path: tauri/keystroke/target/release/keystroke
          retention-days: 1

  build-virtual-joystick:
    name: Build Virtual Joystick (${{ matrix.target }})
    needs: [verify-version]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows_x86_64
            tauri_target: x86_64-pc-windows-msvc

          - os: ubuntu-22.04
            target: linux_x86_64
            tauri_target: x86_64-unknown-linux-gnu

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.tauri_target }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: tauri/virtual_joystick -> target

      - name: Build virtual joystick utility
        working-directory: tauri/virtual_joystick
        run: cargo build --release

      - name: Upload virtual joystick binary (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: virtual-joystick-${{ matrix.target }}
          path: tauri/virtual_joystick/target/release/virtual_joystick.exe
          retention-days: 1

      - name: Upload virtual joystick binary (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: virtual-joystick-${{ matrix.target }}
          path: tauri/virtual_joystick/target/release/virtual_joystick
          retention-days: 1

  download-avrdude:
    name: Download avrdude (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows_x86_64
            avrdude_url: https://github.com/avrdudes/avrdude/releases/download/v8.1/avrdude-v8.1-windows-x64.zip
            avrdude_binary: avrdude.exe
            extract_cmd: unzip -o

          - target: linux_x86_64
            avrdude_url: https://github.com/avrdudes/avrdude/releases/download/v8.1/avrdude_v8.1_Linux_64bit.tar.gz
            avrdude_binary: avrdude
            extract_cmd: tar xzf

    steps:
      - name: Download avrdude
        run: |
          curl -L -o avrdude-archive.zip "${{ matrix.avrdude_url }}"
          ${{ matrix.extract_cmd }} avrdude-archive.zip
          # Find and copy the avrdude binary
          find . -name "${{ matrix.avrdude_binary }}" -type f | head -1 | xargs -I {} cp {} avrdude-binary
          # Also copy avrdude.conf if it exists
          find . -name "avrdude.conf" -type f | head -1 | xargs -I {} cp {} avrdude.conf || true
          ls -la

      - name: Upload avrdude binary
        uses: actions/upload-artifact@v7
        with:
          name: avrdude-${{ matrix.target }}
          path: |
            avrdude-binary
            avrdude.conf
          retention-days: 1

  download-vcredist:
    name: Download VC++ Redistributable
    runs-on: ubuntu-latest
    steps:
      - name: Cache VC++ Redistributable
        id: cache-vcredist
        uses: actions/cache@v6
        with:
          path: vc_redist.x64.exe
          key: vcredist-x64-2022

      - name: Download VC++ Redistributable
        if: steps.cache-vcredist.outputs.cache-hit != 'true'
        run: curl -L -o vc_redist.x64.exe https://aka.ms/vs/17/release/vc_redist.x64.exe

      - name: Upload VC++ Redistributable
        uses: actions/upload-artifact@v7
        with:
          name: vcredist
          path: vc_redist.x64.exe
          retention-days: 1

  build-tauri:
    name: Build Tauri (${{ matrix.target }})
    needs: [verify-version, build-keystroke, build-virtual-joystick, download-avrdude, download-vcredist]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows_x86_64
            tauri_target: x86_64-pc-windows-msvc
            rust_config: src-tauri/tauri.rust.windows.conf.json
            tauri_args: ""

          - os: ubuntu-22.04
            target: linux_x86_64
            tauri_target: x86_64-unknown-linux-gnu
            rust_config: src-tauri/tauri.rust.conf.json
            tauri_args: "--bundles appimage"

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download avrdude
        uses: actions/download-artifact@v8
        with:
          name: avrdude-${{ matrix.target }}
          path: tauri/src-tauri/binaries/avrdude-download

      - name: Download keystroke
        uses: actions/download-artifact@v8
        with:
          name: keystroke-${{ matrix.target }}
          path: tauri/src-tauri/binaries/keystroke-download

      - name: Download VC++ Redistributable
        if: runner.os == 'Windows'
        uses: actions/download-artifact@v8
        with:
          name: vcredist
          path: tauri/src-tauri/resources

      - name: Install pinned vJoy extractor
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innoextract --version 1.9 -y --no-progress

      - name: Stage verified vJoy resources
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/stage-vjoy-resources.ps1

      - name: Locate Windows libclang for the vendored vJoy bindings
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $locations = @('C:\Program Files\LLVM\bin', 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\Llvm\x64\bin')
          $clang = $locations | Where-Object { Test-Path (Join-Path $_ 'libclang.dll') } | Select-Object -First 1
          if (-not $clang) { throw 'A real libclang.dll is required for vendored vJoy bindings.' }
          "LIBCLANG_PATH=$clang" >> $env:GITHUB_ENV

      - name: Prepare binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Prepare avrdude binary
          Move-Item -Path "tauri/src-tauri/binaries/avrdude-download/avrdude-binary" `
                    -Destination "tauri/src-tauri/binaries/avrdude-${{ matrix.tauri_target }}.exe"

          # Copy avrdude.conf if it exists
          if (Test-Path "tauri/src-tauri/binaries/avrdude-download/avrdude.conf") {
            Copy-Item -Path "tauri/src-tauri/binaries/avrdude-download/avrdude.conf" `
                      -Destination "tauri/src-tauri/binaries/"
          }

          # Prepare keystroke binary
          Move-Item -Path "tauri/src-tauri/binaries/keystroke-download/keystroke.exe" `
                    -Destination "tauri/src-tauri/binaries/keystroke-${{ matrix.tauri_target }}.exe"

          # Clean up download folders
          Remove-Item -Recurse -Force "tauri/src-tauri/binaries/avrdude-download"
          Remove-Item -Recurse -Force "tauri/src-tauri/binaries/keystroke-download"

          Get-ChildItem tauri/src-tauri/binaries/

      - name: Prepare binaries (Unix)
        if: runner.os != 'Windows'
        run: |
          # Prepare avrdude binary
          mv "tauri/src-tauri/binaries/avrdude-download/avrdude-binary" \
             "tauri/src-tauri/binaries/avrdude-${{ matrix.tauri_target }}"
          chmod +x "tauri/src-tauri/binaries/avrdude-${{ matrix.tauri_target }}"

          # Copy avrdude.conf if it exists
          if [ -f "tauri/src-tauri/binaries/avrdude-download/avrdude.conf" ]; then
            cp "tauri/src-tauri/binaries/avrdude-download/avrdude.conf" \
               "tauri/src-tauri/binaries/"
          fi

          # Prepare keystroke binary
          mv "tauri/src-tauri/binaries/keystroke-download/keystroke" \
             "tauri/src-tauri/binaries/keystroke-${{ matrix.tauri_target }}"
          chmod +x "tauri/src-tauri/binaries/keystroke-${{ matrix.tauri_target }}"

          # Clean up download folders
          rm -rf "tauri/src-tauri/binaries/avrdude-download"
          rm -rf "tauri/src-tauri/binaries/keystroke-download"

          ls -la tauri/src-tauri/binaries/

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.tauri_target }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri -> target

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            tauri/package-lock.json
            tauri/ui/package-lock.json

      - name: Install CLI and frontend dependencies, build the UI
        working-directory: tauri
        run: |
          npm ci
          npm --prefix ui ci
          npm --prefix ui run build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TRENINO_RUST_BUNDLE: 1
        with:
          projectPath: tauri
          tauriScript: npx tauri
          args: ${{ matrix.tauri_args }} --features rust-ui,desktop-updater --config ${{ matrix.rust_config }} --config src-tauri/tauri.updater.conf.json
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          tagName: v${{ needs.verify-version.outputs.version }}
          releaseName: "trenino v${{ needs.verify-version.outputs.version }}"
          releaseBody: "See the release notes for details."
          releaseDraft: false
          prerelease: false
