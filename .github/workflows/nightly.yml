name: Nightly Build

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: nightly-build
  cancel-in-progress: true

jobs:
  check-changes:
    name: Check for Changes
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Restore cached SHA
        id: cache-sha
        uses: actions/cache/restore@v6
        with:
          path: nightly-last-sha.txt
          key: nightly-sha-dummy
          restore-keys: |
            nightly-sha-

      - name: Check if build is needed
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger - always build"
            echo "should_build=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          LAST_SHA=""
          if [ -f nightly-last-sha.txt ]; then
            LAST_SHA=$(cat nightly-last-sha.txt)
          fi

          CURRENT_SHA="${{ github.sha }}"

          echo "Last SHA: $LAST_SHA"
          echo "Current SHA: $CURRENT_SHA"

          if [ "$LAST_SHA" = "$CURRENT_SHA" ]; then
            echo "No changes since last nightly build"
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected, building"
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

  build-keystroke:
    name: Build Keystroke (${{ matrix.target }})
    needs: [check-changes]
    if: needs.check-changes.outputs.should_build == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows_x86_64
            tauri_target: x86_64-pc-windows-msvc
            binary_ext: ".exe"

          - os: ubuntu-22.04
            target: linux_x86_64
            tauri_target: x86_64-unknown-linux-gnu
            binary_ext: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxdo-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.tauri_target }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: tauri/keystroke -> target

      - name: Build keystroke utility
        working-directory: tauri/keystroke
        run: cargo build --release

      - name: Upload keystroke binary (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: keystroke-${{ matrix.target }}
          path: tauri/keystroke/target/release/keystroke.exe
          retention-days: 7

      - name: Upload keystroke binary (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: keystroke-${{ matrix.target }}
          path: tauri/keystroke/target/release/keystroke
          retention-days: 7

  build-virtual-joystick:
    name: Build Virtual Joystick (${{ matrix.target }})
    needs: [check-changes]
    if: needs.check-changes.outputs.should_build == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows_x86_64
            tauri_target: x86_64-pc-windows-msvc

          - os: ubuntu-22.04
            target: linux_x86_64
            tauri_target: x86_64-unknown-linux-gnu

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.tauri_target }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: tauri/virtual_joystick -> target

      - name: Build virtual joystick utility
        working-directory: tauri/virtual_joystick
        run: cargo build --release

      - name: Upload virtual joystick binary (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: virtual-joystick-${{ matrix.target }}
          path: tauri/virtual_joystick/target/release/virtual_joystick.exe
          retention-days: 7

      - name: Upload virtual joystick binary (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: virtual-joystick-${{ matrix.target }}
          path: tauri/virtual_joystick/target/release/virtual_joystick
          retention-days: 7

  download-avrdude:
    name: Download avrdude (${{ matrix.target }})
    needs: [check-changes]
    if: needs.check-changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows_x86_64
            avrdude_url: https://github.com/avrdudes/avrdude/releases/download/v8.1/avrdude-v8.1-windows-x64.zip
            avrdude_binary: avrdude.exe
            extract_cmd: unzip -o

          - target: linux_x86_64
            avrdude_url: https://github.com/avrdudes/avrdude/releases/download/v8.1/avrdude_v8.1_Linux_64bit.tar.gz
            avrdude_binary: avrdude
            extract_cmd: tar xzf

    steps:
      - name: Download avrdude
        run: |
          curl -L -o avrdude-archive.zip "${{ matrix.avrdude_url }}"
          ${{ matrix.extract_cmd }} avrdude-archive.zip
          # Find and copy the avrdude binary
          find . -name "${{ matrix.avrdude_binary }}" -type f | head -1 | xargs -I {} cp {} avrdude-binary
          # Also copy avrdude.conf if it exists
          find . -name "avrdude.conf" -type f | head -1 | xargs -I {} cp {} avrdude.conf || true
          ls -la

      - name: Upload avrdude binary
        uses: actions/upload-artifact@v7
        with:
          name: avrdude-${{ matrix.target }}
          path: |
            avrdude-binary
            avrdude.conf
          retention-days: 7

  download-vcredist:
    name: Download VC++ Redistributable
    needs: [check-changes]
    if: needs.check-changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Cache VC++ Redistributable
        id: cache-vcredist
        uses: actions/cache@v6
        with:
          path: vc_redist.x64.exe
          key: vcredist-x64-2022

      - name: Download VC++ Redistributable
        if: steps.cache-vcredist.outputs.cache-hit != 'true'
        run: curl -L -o vc_redist.x64.exe https://aka.ms/vs/17/release/vc_redist.x64.exe

      - name: Upload VC++ Redistributable
        uses: actions/upload-artifact@v7
        with:
          name: vcredist
          path: vc_redist.x64.exe
          retention-days: 7

  build-tauri:
    name: Build Tauri (${{ matrix.target }})
    needs: [check-changes, build-keystroke, build-virtual-joystick, download-avrdude, download-vcredist]
    if: needs.check-changes.outputs.should_build == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows_x86_64
            artifact_name: Trenino-nightly-windows-x86_64
            tauri_target: x86_64-pc-windows-msvc
            tauri_args: ""

          - os: ubuntu-22.04
            target: linux_x86_64
            artifact_name: Trenino-nightly-linux-x86_64
            tauri_target: x86_64-unknown-linux-gnu
            tauri_args: "--bundles appimage"

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download avrdude
        if: runner.os == 'Linux'
        uses: actions/download-artifact@v8
        with:
          name: avrdude-${{ matrix.target }}
          path: tauri/src-tauri/binaries/avrdude-download

      - name: Prepare avrdude binary (Unix)
        if: runner.os == 'Linux'
        run: |
          mv "tauri/src-tauri/binaries/avrdude-download/avrdude-binary" \
             "tauri/src-tauri/binaries/avrdude-${{ matrix.tauri_target }}"
          chmod +x "tauri/src-tauri/binaries/avrdude-${{ matrix.tauri_target }}"

          if [ -f "tauri/src-tauri/binaries/avrdude-download/avrdude.conf" ]; then
            cp "tauri/src-tauri/binaries/avrdude-download/avrdude.conf" \
               "tauri/src-tauri/binaries/"
          fi

          rm -rf "tauri/src-tauri/binaries/avrdude-download"
          ls -la tauri/src-tauri/binaries/

      - name: Download VC++ Redistributable
        if: runner.os == 'Windows'
        uses: actions/download-artifact@v8
        with:
          name: vcredist
          path: tauri/src-tauri/resources

      - name: Install pinned vJoy extractor
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innoextract --version 1.9 -y --no-progress

      - name: Locate Windows libclang for the vendored vJoy bindings
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $locations = @('C:\Program Files\LLVM\bin', 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\Llvm\x64\bin')
          $clang = $locations | Where-Object { Test-Path (Join-Path $_ 'libclang.dll') } | Select-Object -First 1
          if (-not $clang) { throw 'A real libclang.dll is required for vendored vJoy bindings.' }
          "LIBCLANG_PATH=$clang" >> $env:GITHUB_ENV

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.tauri_target }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri -> target

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: tauri/ui/package-lock.json

      - name: Build Rust desktop package
        shell: bash
        run: ./scripts/build-rust-desktop.sh ${{ matrix.tauri_args }}

      - name: Prepare clearly named Windows downloads
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "nightly-artifacts" | Out-Null
          $nsis = Get-ChildItem "tauri/src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File | Select-Object -First 1
          $msi = Get-ChildItem "tauri/src-tauri/target/release/bundle/msi" -Filter "*.msi" -File | Select-Object -First 1
          if (-not $nsis) { throw "The Windows NSIS installer was not produced." }
          if (-not $msi) { throw "The Windows MSI installer was not produced." }
          Copy-Item -LiteralPath $nsis.FullName -Destination "nightly-artifacts/Trenino-nightly-windows-x86_64-setup.exe"
          Copy-Item -LiteralPath $msi.FullName -Destination "nightly-artifacts/Trenino-nightly-windows-x86_64.msi"

      - name: Prepare clearly named Linux download
        if: runner.os == 'Linux'
        run: |
          mkdir -p nightly-artifacts
          appimage=$(find tauri/src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print -quit)
          test -n "$appimage"
          cp "$appimage" nightly-artifacts/Trenino-nightly-linux-x86_64.AppImage

      - name: Upload Tauri installers
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: nightly-artifacts/*
          if-no-files-found: error
          retention-days: 7

  update-nightly-sha:
    name: Update Nightly SHA
    needs: [build-tauri, check-changes]
    if: needs.check-changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Save current SHA
        run: echo "${{ github.sha }}" > nightly-last-sha.txt

      - name: Cache SHA for next run
        uses: actions/cache/save@v6
        with:
          path: nightly-last-sha.txt
          key: nightly-sha-${{ github.run_id }}
