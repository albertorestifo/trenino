name: Nightly Build

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-build
  cancel-in-progress: true

env:
  AVRDUDE_LINUX_X86_64_URL: https://github.com/avrdudes/avrdude/releases/download/v8.1/avrdude_v8.1_Linux_64bit.tar.gz
  AVRDUDE_LINUX_X86_64_SHA256: c751c88b1c0b886834d85cd4b19f100cc3415c896ab9f98cf7e2955edbcd678f
  VCREDIST_X64_URL: https://aka.ms/vs/17/release/vc_redist.x64.exe
  VCREDIST_X64_SHA256: cc0ff0eb1dc3f5188ae6300faef32bf5beeba4bdd6e8e445a9184072096b713b

jobs:
  check-changes:
    name: Check for Changes
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Restore cached SHA
        id: cache-sha
        uses: actions/cache/restore@v6
        with:
          path: nightly-last-sha.txt
          key: nightly-sha-dummy
          restore-keys: |
            nightly-sha-

      - name: Check if build is needed
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger - always build"
            echo "should_build=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          LAST_SHA=""
          if [ -f nightly-last-sha.txt ]; then
            LAST_SHA=$(cat nightly-last-sha.txt)
          fi

          CURRENT_SHA="${{ github.sha }}"

          echo "Last SHA: $LAST_SHA"
          echo "Current SHA: $CURRENT_SHA"

          if [ "$LAST_SHA" = "$CURRENT_SHA" ]; then
            echo "No changes since last nightly build"
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected, building"
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

  build-tauri:
    name: Build Tauri (${{ matrix.target }})
    needs: [check-changes]
    if: needs.check-changes.outputs.should_build == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows_x86_64
            artifact_name: Trenino-nightly-windows-x86_64
            tauri_target: x86_64-pc-windows-msvc
            tauri_args: ""

          - os: ubuntu-22.04
            target: linux_x86_64
            artifact_name: Trenino-nightly-linux-x86_64
            tauri_target: x86_64-unknown-linux-gnu
            tauri_args: "--bundles appimage"

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Stage checksum-verified avrdude sidecar (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fL -o avrdude.tar.gz "$AVRDUDE_LINUX_X86_64_URL"
          echo "$AVRDUDE_LINUX_X86_64_SHA256  avrdude.tar.gz" | sha256sum -c -
          tar -xzf avrdude.tar.gz
          mkdir -p tauri/src-tauri/binaries
          cp avrdude_Linux_64bit/bin/avrdude "tauri/src-tauri/binaries/avrdude-${{ matrix.tauri_target }}"
          chmod +x "tauri/src-tauri/binaries/avrdude-${{ matrix.tauri_target }}"
          cp avrdude_Linux_64bit/etc/avrdude.conf tauri/src-tauri/binaries/avrdude.conf

      - name: Stage checksum-verified VC++ Redistributable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force tauri/src-tauri/resources | Out-Null
          Invoke-WebRequest -UseBasicParsing -Uri "$env:VCREDIST_X64_URL" -OutFile vc_redist.x64.exe
          $hash = (Get-FileHash -Algorithm SHA256 vc_redist.x64.exe).Hash.ToLower()
          if ($hash -ne "$env:VCREDIST_X64_SHA256") { throw "vc_redist checksum mismatch: $hash" }
          Move-Item vc_redist.x64.exe tauri/src-tauri/resources/vc_redist.x64.exe

      - name: Install pinned vJoy extractor
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innoextract --version 1.9 -y --no-progress

      - uses: ./.github/actions/setup-libclang
        if: runner.os == 'Windows'

      - uses: ./.github/actions/linux-desktop-deps
        if: runner.os == 'Linux'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.91.1
        with:
          targets: ${{ matrix.tauri_target }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            tauri/src-tauri -> target
            tauri/keystroke -> target

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            tauri/package-lock.json
            tauri/ui/package-lock.json

      - name: Build Rust desktop package
        shell: bash
        run: ./scripts/build-rust-desktop.sh ${{ matrix.tauri_args }}

      - name: Prepare clearly named Windows downloads
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "nightly-artifacts" | Out-Null
          $nsis = Get-ChildItem "tauri/src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File | Select-Object -First 1
          $msi = Get-ChildItem "tauri/src-tauri/target/release/bundle/msi" -Filter "*.msi" -File | Select-Object -First 1
          if (-not $nsis) { throw "The Windows NSIS installer was not produced." }
          if (-not $msi) { throw "The Windows MSI installer was not produced." }
          Copy-Item -LiteralPath $nsis.FullName -Destination "nightly-artifacts/Trenino-nightly-windows-x86_64-setup.exe"
          Copy-Item -LiteralPath $msi.FullName -Destination "nightly-artifacts/Trenino-nightly-windows-x86_64.msi"

      - name: Prepare clearly named Linux download
        if: runner.os == 'Linux'
        run: |
          mkdir -p nightly-artifacts
          appimage=$(find tauri/src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print -quit)
          test -n "$appimage"
          cp "$appimage" nightly-artifacts/Trenino-nightly-linux-x86_64.AppImage

      - name: Upload Tauri installers
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: nightly-artifacts/*
          if-no-files-found: error
          retention-days: 7

  update-nightly-sha:
    name: Update Nightly SHA
    needs: [build-tauri, check-changes]
    if: needs.check-changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Save current SHA
        run: echo "${{ github.sha }}" > nightly-last-sha.txt

      - name: Cache SHA for next run
        uses: actions/cache/save@v6
        with:
          path: nightly-last-sha.txt
          key: nightly-sha-${{ github.run_id }}
