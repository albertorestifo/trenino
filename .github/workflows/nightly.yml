name: Nightly Build

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: nightly-build
  cancel-in-progress: true

jobs:
  check-changes:
    name: Check for Changes
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      # Build when master moved since the last successful nightly. A failed
      # nightly does not count, so the next night retries the same commit.
      - name: Compare with the last successful nightly
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger - always build"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LAST_SHA=$(gh run list -R "$GITHUB_REPOSITORY" --workflow nightly.yml --branch "$GITHUB_REF_NAME" \
            --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
          echo "Last successful nightly: ${LAST_SHA:-none}"
          echo "Current SHA: $GITHUB_SHA"

          if [ "$LAST_SHA" = "$GITHUB_SHA" ]; then
            echo "No changes since last nightly build"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build
    needs: [check-changes]
    if: needs.check-changes.outputs.should_build == 'true'
    uses: ./.github/workflows/build-desktop.yml
    with:
      channel: nightly
    secrets: inherit
