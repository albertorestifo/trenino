name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels its previous run. Runs on master are never
# cancelled, so every merge gets a result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MIX_ENV: test
  ELIXIR_VERSION: "1.20"
  OTP_VERSION: "29"

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps
        uses: actions/cache@v6
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Cache _build
        uses: actions/cache@v6
        with:
          path: _build
          key: ${{ runner.os }}-build-${{ env.MIX_ENV }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-build-${{ env.MIX_ENV }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

      - name: Run Credo (strict)
        run: mix credo --strict

      - name: Run tests
        run: mix test


  # The Windows package job takes ~25 minutes and only exercises packaging, so
  # PRs run it only when packaging inputs change. Pushes to master skip it: the
  # PR already ran it, and the nightly build packages master every day.
  changes:
    name: Detect packaging changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      packaging: ${{ steps.filter.outputs.packaging }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            packaging:
              - 'tauri/**'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
              - 'mix.exs'
              - 'mix.lock'
              - 'config/**'

  windows-package:
    name: Windows package
    needs: [changes]
    if: |
      !cancelled() &&
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.packaging == 'true')
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Set up Burrito prerequisites
        uses: ./.github/actions/setup-burrito

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            tauri/src-tauri -> target
            tauri/keystroke -> target

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: tauri/package-lock.json

      - name: Install pinned Tauri CLI dependencies
        working-directory: tauri
        run: npm ci

      - name: Reject mismatched updater signing keys without uploading secrets
        shell: pwsh
        run: ./scripts/test-updater-signing.ps1

      # The Tauri CLI comes from tauri/package-lock.json (npm ci above), so it
      # is not compiled from source here.
      - name: Stage existing Windows prerequisites
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tauri/src-tauri/resources | Out-Null
          Invoke-WebRequest -UseBasicParsing -Uri https://aka.ms/vs/17/release/vc_redist.x64.exe -OutFile tauri/src-tauri/resources/vc_redist.x64.exe

      - name: Exercise checksum failure and success paths
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\avrdude-test" | Out-Null
          & pwsh -NoProfile -NonInteractive -File ./scripts/download-avrdude.ps1 -Version 8.1 -ExpectedSha256 ('0' * 64) -DestinationDirectory "$env:RUNNER_TEMP\avrdude-test" -TargetTriple fixture
          if ($LASTEXITCODE -eq 0) { throw "An incorrect avrdude checksum unexpectedly succeeded" }
          if (Test-Path -LiteralPath "$env:RUNNER_TEMP\avrdude-test\avrdude-fixture.exe") { throw "A failed avrdude download created the executable" }
          if (Test-Path -LiteralPath "$env:RUNNER_TEMP\avrdude-test\avrdude.conf") { throw "A failed avrdude download created the configuration" }
          # The expected failure above leaves LASTEXITCODE at 1, and the runner's
          # pwsh wrapper exits with it, so clear it once the checks have passed.
          $global:LASTEXITCODE = 0

      - name: Build Burrito and Tauri package
        env:
          BURRITO_TARGET: windows_x86_64
        shell: bash
        run: |
          mix deps.get
          ./scripts/build-desktop.sh

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: trenino-windows-nsis
          path: tauri/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Test stable updater integration without signing or publishing
        shell: pwsh
        run: cargo test --manifest-path tauri/src-tauri/Cargo.toml --features desktop-updater

