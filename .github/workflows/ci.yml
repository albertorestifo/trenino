name: CI

on:
  push:
    branches: [master, main]
    paths: ['Cargo.*', 'crates/**', 'vendor/vjoy/**', 'tauri/**', 'scripts/**', '.github/workflows/ci.yml', '.github/actions/**']
  pull_request:
    branches: [master, main]
    paths: ['Cargo.*', 'crates/**', 'vendor/vjoy/**', 'tauri/**', 'scripts/**', '.github/workflows/ci.yml', '.github/actions/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-bundle-config:
    name: Verify bundle configuration
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Verify vJoy packaging is Windows-only
        run: |
          test "$(jq '[.bundle.externalBin[], .bundle.resources[]] | map(select(test("virtual_joystick|vJoy|THIRD_PARTY"))) | length' tauri/src-tauri/tauri.conf.json)" -eq 0
          test "$(jq '[.bundle.externalBin[], .bundle.resources[]] | map(select(test("virtual_joystick|vJoy|THIRD_PARTY"))) | length' tauri/src-tauri/tauri.rust.conf.json)" -eq 0
          test "$(jq '[.bundle.externalBin[], .bundle.resources[]] | map(select(test("virtual_joystick|vJoy|THIRD_PARTY"))) | length' tauri/src-tauri/tauri.rust.windows.conf.json)" -ge 6

  windows-package:
    name: Windows package (no driver mutation)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.91.1
        with:
          targets: x86_64-pc-windows-msvc

      - name: Set up Node.js for signing regression tests
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tauri/package-lock.json

      - name: Install pinned Tauri CLI dependencies
        working-directory: tauri
        run: npm ci

      - name: Reject mismatched updater signing keys without uploading secrets
        shell: pwsh
        run: ./scripts/test-updater-signing.ps1

      - name: Stage existing Windows prerequisite
        shell: pwsh
        run: |
          choco install innoextract --version 1.9 -y --no-progress
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force tauri/src-tauri/resources | Out-Null
          Invoke-WebRequest -UseBasicParsing -Uri https://aka.ms/vs/17/release/vc_redist.x64.exe -OutFile vc_redist.x64.exe
          $hash = (Get-FileHash -Algorithm SHA256 vc_redist.x64.exe).Hash.ToLower()
          if ($hash -ne 'cc0ff0eb1dc3f5188ae6300faef32bf5beeba4bdd6e8e445a9184072096b713b') { throw "vc_redist checksum mismatch: $hash" }
          Move-Item vc_redist.x64.exe tauri/src-tauri/resources/vc_redist.x64.exe

      - uses: ./.github/actions/setup-libclang

      - name: Exercise checksum failure and success paths
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\avrdude-test" | Out-Null
          & pwsh -NoProfile -NonInteractive -File ./scripts/download-avrdude.ps1 -Version 8.1 -ExpectedSha256 ('0' * 64) -DestinationDirectory "$env:RUNNER_TEMP\avrdude-test" -TargetTriple fixture
          if ($LASTEXITCODE -eq 0) { throw "An incorrect avrdude checksum unexpectedly succeeded" }
          if (Test-Path -LiteralPath "$env:RUNNER_TEMP\avrdude-test\avrdude-fixture.exe") { throw "A failed avrdude download created the executable" }
          if (Test-Path -LiteralPath "$env:RUNNER_TEMP\avrdude-test\avrdude.conf") { throw "A failed avrdude download created the configuration" }

          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\vjoy-test" | Out-Null
          $fixtureUrl = 'https://raw.githubusercontent.com/BrunnerInnovation/vJoy/v2.2.2.0/LICENSE.txt'
          $fixtureHash = '7f0ed151caab68bbfd1a37727c8fe75c94be45aff98a88d63bc7e46e3fb0c5e1'
          & pwsh -NoProfile -NonInteractive -File ./scripts/download-vjoy.ps1 -Version fixture -Url $fixtureUrl -ExpectedSha256 ('0' * 64) -Destination "$env:RUNNER_TEMP\vjoy-test\destination.txt"
          if ($LASTEXITCODE -eq 0) { throw "An incorrect checksum unexpectedly succeeded" }
          if (Test-Path -LiteralPath "$env:RUNNER_TEMP\vjoy-test\destination.txt") { throw "A failed download created the destination" }
          & ./scripts/download-vjoy.ps1 -Version fixture -Url $fixtureUrl -ExpectedSha256 $fixtureHash -Destination "$env:RUNNER_TEMP\vjoy-test\destination.txt"
          & pwsh -NoProfile -NonInteractive -File ./scripts/download-vjoy.ps1 -Version fixture -Url $fixtureUrl -ExpectedSha256 ('0' * 64) -Destination "$env:RUNNER_TEMP\vjoy-test\destination.txt"
          if ($LASTEXITCODE -eq 0) { throw "An incorrect replacement checksum unexpectedly succeeded" }
          if ((Get-FileHash -Algorithm SHA256 "$env:RUNNER_TEMP\vjoy-test\destination.txt").Hash -ne $fixtureHash) { throw "A failed replacement changed the verified destination" }
          & ./scripts/download-vjoy.ps1 -Version fixture -Url https://invalid.example.invalid/unused -ExpectedSha256 $fixtureHash -Destination "$env:RUNNER_TEMP\vjoy-test\destination.txt" -VerifyOnly

      - name: Download and verify pinned vJoy release inputs
        shell: pwsh
        run: |
          $resources = "tauri/src-tauri/resources"
          & ./scripts/download-vjoy.ps1 -Version 2.2.2.0 -Url https://github.com/BrunnerInnovation/vJoy/releases/download/v2.2.2.0/vJoySetup_v2.2.2.0_Win10_Win11.exe -ExpectedSha256 ef569a3105cd301b89580f18f60c66b339e95296acf2c0dfcaf4b4bbf8ab68fe -Destination "$resources/vJoySetup.exe"
          & ./scripts/download-vjoy.ps1 -Version 2.2.2.0-sdk -Url https://github.com/BrunnerInnovation/vJoy/releases/download/v2.2.2.0/SDK.zip -ExpectedSha256 0e796b185b66819d5fbeae645f3f038ecbfbbde837d3d3f06cba82ae1db07c67 -Destination "$resources/SDK.zip"
          & ./scripts/download-vjoy.ps1 -Version 2.2.2.0-license -Url https://raw.githubusercontent.com/BrunnerInnovation/vJoy/v2.2.2.0/LICENSE.txt -ExpectedSha256 7f0ed151caab68bbfd1a37727c8fe75c94be45aff98a88d63bc7e46e3fb0c5e1 -Destination "$resources/vJoy-LICENSE.txt"
          & ./scripts/download-vjoy.ps1 -Version 2.2.2.0 -Url https://invalid.example.invalid/unused -ExpectedSha256 ef569a3105cd301b89580f18f60c66b339e95296acf2c0dfcaf4b4bbf8ab68fe -Destination "$resources/vJoySetup.exe" -VerifyOnly
          $signature = Get-AuthenticodeSignature -LiteralPath "$resources/vJoySetup.exe"
          if ($signature.Status -ne 'Valid') { throw "vJoy installer Authenticode status is $($signature.Status)" }
          if ($signature.SignerCertificate.Subject -notmatch 'BRUNNER') { throw "Unexpected vJoy signer: $($signature.SignerCertificate.Subject)" }
          Write-Host "Verified vJoy signer: $($signature.SignerCertificate.Subject)"

      - name: Build keystroke sidecar
        shell: pwsh
        run: cargo build --release --manifest-path tauri/keystroke/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Build Rust desktop package
        shell: bash
        run: ./scripts/build-rust-desktop.sh

      - name: Inspect packaged vJoy resources
        shell: pwsh
        run: |
          $expected = @(
            "tauri/src-tauri/resources/vJoyConfig.exe",
            "tauri/src-tauri/resources/vJoyInstall.dll",
            "tauri/src-tauri/resources/vJoyInterface.dll",
            "tauri/src-tauri/resources/vJoy-LICENSE.txt",
            "tauri/src-tauri/resources/THIRD_PARTY_NOTICES.md"
          )
          $expected | ForEach-Object { if (-not (Test-Path -LiteralPath $_ -PathType Leaf)) { throw "Missing packaged resource: $_" } }
          $installer = Get-ChildItem tauri/src-tauri/target/release/bundle/nsis -Filter *.exe -File | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer artifact was not produced" }
          $inspection = Join-Path $env:RUNNER_TEMP "trenino-nsis-inspection"
          New-Item -ItemType Directory -Force $inspection | Out-Null
          & 7z x -y "-o$inspection" $installer.FullName | Out-Null
          Get-ChildItem $inspection -Recurse -Filter *.zip -File | ForEach-Object {
            $expanded = Join-Path $inspection $_.BaseName
            New-Item -ItemType Directory -Force $expanded | Out-Null
            & 7z x -y "-o$expanded" $_.FullName | Out-Null
          }
          $listing = (Get-ChildItem $inspection -Recurse -File | ForEach-Object FullName) -join "`n"
          @('vJoyConfig.exe', 'vJoyInstall.dll', 'vJoyInterface.dll', 'vJoy-LICENSE.txt', 'THIRD_PARTY_NOTICES.md') | ForEach-Object {
            if ($listing -notmatch [regex]::Escape($_)) { throw "Packaged NSIS artifact does not contain $_" }
          }

          # Read-only probe: catch missing loader dependencies even without a driver.
          $config = (Get-ChildItem $inspection -Recurse -Filter 'vJoyConfig.exe' -File | Select-Object -First 1).FullName
          $probe = (& $config -t -c 2>&1) -join "`n"
          if ($LASTEXITCODE -ne 0 -or $probe -notmatch 'Product ID:|vJoy driver is not installed or disabled') {
            throw "Packaged vJoyConfig could not query the driver: $probe (exit $LASTEXITCODE)"
          }

          $dll = (Get-ChildItem $inspection -Recurse -Filter 'vJoyInterface.dll' -File | Select-Object -First 1).FullName
          if (-not $dll) { throw "Installed-layout vJoyInterface.dll was not extracted" }
          if ((Split-Path -Leaf (Split-Path -Parent $dll)) -ne 'resources') { throw "vJoyInterface.dll is not in the installed resources directory" }
          Write-Host "NSIS artifact: $($installer.FullName)"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: trenino-windows-nsis
          path: tauri/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Test stable updater integration without signing or publishing
        shell: pwsh
        run: cargo test --manifest-path tauri/src-tauri/Cargo.toml --features desktop-updater

  # Real driver installation belongs in a self-hosted, disposable Windows VM.
  # It is intentionally absent from ordinary CI because driver mutation requires
  # elevation/reboots and could damage shared hosted-runner state.
