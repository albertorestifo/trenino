name: Claude Code Review

# Reviews once when a PR opens or leaves draft, not on every push. Ask for a
# fresh review with an "@claude review" comment (handled by claude.yml).
on:
  pull_request:
    types: [opened, ready_for_review, reopened]

jobs:
  claude-review:
    # Skip draft PRs, PRs by claude[bot] (circular reviews), and Dependabot PRs.
    # Dependabot cannot read secrets on pull_request events, so its runs would
    # always fail.
    if: |
      !github.event.pull_request.draft &&
      github.event.pull_request.user.login != 'claude[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: read
      actions: read
      # Required even with claude_code_oauth_token: the action uses OIDC to
      # obtain its GitHub App token.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1.0.286
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          # The official code-review plugin reviews the diff against the
          # repository's CLAUDE.md files, so project guidelines live there
          # rather than in this prompt.
          plugin_marketplaces: "https://github.com/anthropics/claude-plugins-official.git"
          plugins: "code-review@claude-plugins-official"
          # --comment posts findings as inline PR comments (or one summary
          # comment when nothing is found). Without it results only reach the
          # run log.
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # Must stay: the inline-comment MCP server only starts when
          # claude_args names its tool.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
